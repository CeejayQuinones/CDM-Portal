name: Release technical gates

on:
  push:
    branches: [fix/audit-findings, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-renderers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CDM_Frontend
    env:
      VITE_API_BASE_URL: https://api.example.invalid/api
      VITE_DESKTOP_API_BASE_URL: https://api.example.invalid/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CDM_Frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Run frontend tests
        run: npm test
      - name: Build Website renderer
        run: npm run build
      - name: Build Android renderer
        run: npm run mobile:build
      - name: Build Desktop renderer
        run: npx vite build --mode desktop

  android-debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CDM_Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CDM_Frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build Android renderer with synthetic API endpoint
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
        run: npm run mobile:build
      - name: Sync Android native project
        run: npx cap sync android
      - name: Compile disposable unsigned Android debug APK
        run: bash gradlew assembleDebug
        working-directory: CDM_Frontend/android

  desktop-windows-package:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CDM_Frontend
    env:
      VITE_DESKTOP_API_BASE_URL: https://api.example.invalid/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CDM_Frontend/package-lock.json
      - name: Install locked frontend and Electron dependencies
        run: npm ci
      - name: Build disposable unsigned Windows installer
        run: npm run desktop:win:build

  backend-sqlite-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, gd, intl, mbstring, pdo_sqlite, xml, zip
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run complete backend suite on disposable SQLite
        run: php artisan test --compact

  mariadb-104:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.4.34
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: cdm_release_ci
          MARIADB_USER: cdm_ci
          MARIADB_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DB_CONNECTION: mysql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cdm_release_ci
      DB_USERNAME: cdm_ci
      DB_PASSWORD: ci-test-only
      DB_SOCKET: ''
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TURNSTILE_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, gd, intl, mbstring, pdo_mysql, xml, zip
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Assert disposable MariaDB 10.4 target
        run: |
          php -r '$pdo = new PDO("mysql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT") . ";dbname=" . getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD")); $row = $pdo->query("SELECT VERSION(), DATABASE()")->fetch(PDO::FETCH_NUM); echo "Server: {$row[0]}; database: {$row[1]}\n"; if (!str_starts_with($row[0], "10.4.") || $row[1] !== "cdm_release_ci" || getenv("DB_HOST") !== "127.0.0.1") exit(1);'
      - name: Run complete migration sequence
        run: |
          php artisan migrate --force
          php artisan migrate:status
      - name: Test release-critical behavior on MariaDB
        run: >-
          php artisan test
          tests/Feature/HistoricalGradesTest.php
          tests/Feature/EnrollmentAcademicTest.php
          tests/Feature/EnrollmentWorkflowTest.php
          tests/Feature/GradingPhaseTwoTest.php
          tests/Feature/GradingPhaseThreeTest.php
          tests/Feature/AuthenticationTest.php
          tests/Feature/LoginOtpAuthenticationTest.php
          tests/Feature/TurnstileAuthenticationTest.php
          tests/Feature/GoogleAuthTest.php
          tests/Feature/PlatformAccessControlTest.php
          tests/Feature/StudentLifecycleIntegrationTest.php
          tests/Feature/StudentAccountActivationTest.php
          tests/Feature/StudentAccountVisitTest.php
          tests/Feature/StudentRosterImportTest.php
          tests/Feature/EnrollmentYearLevelTest.php
          tests/Feature/AppointmentAvailabilityConfigurationTest.php
          tests/Feature/LegacyMigrationStagingTest.php

  composer-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Audit locked PHP dependencies
        run: composer audit --locked --format=json --no-interaction

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CDM_Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit frontend dependency lockfile
        run: npm audit --json
      - name: Audit production dependency subset
        if: always()
        run: npm audit --omit=dev --json
